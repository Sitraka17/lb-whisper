<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lb-whisper in the browser</title>
<meta name="description" content="Luxembourgish speech recognition that runs on your own computer. The audio never leaves the browser.">
<style>
  :root {
    --ink: #1a1a1a; --muted: #5a5a5a; --rule: #c9c4b8; --paper: #fbfaf6; --panel: #f3f1ea;
    --accent: #7a1f1f; --ok: #2f5d2f;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8e4da; --muted: #a9a399; --rule: #4a463f; --paper: #1b1a18; --panel: #24221f; --accent: #e08a7a; --ok: #8fc48f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 var(--serif); }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  header { border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 8px; }
  h1 { font-size: 30px; font-weight: normal; margin: 0 0 4px; letter-spacing: .01em; }
  .byline { color: var(--muted); font-size: 15px; margin: 0; }
  .abstract { border-bottom: 1px solid var(--rule); padding: 14px 0 16px; margin-bottom: 26px; font-size: 16px; }
  .abstract b { font-variant: small-caps; letter-spacing: .04em; }
  h2 { font-size: 19px; font-weight: normal; margin: 30px 0 10px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
  h2 .n { display: inline-block; min-width: 1.6em; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button, select, label.file {
    font: 15px var(--serif); color: var(--ink); background: var(--panel); border: 1px solid var(--ink);
    padding: 7px 14px; cursor: pointer; border-radius: 0;
  }
  button:hover:not(:disabled), label.file:hover { background: var(--ink); color: var(--paper); }
  button:disabled, label.file[aria-disabled=true] { opacity: .45; cursor: default; pointer-events: none; }
  button.rec { border-color: var(--accent); color: var(--accent); }
  button.rec.on { background: var(--accent); color: var(--paper); }
  input[type=file] { display: none; }
  .note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
  .status { font: 14px var(--mono); color: var(--muted); margin: 12px 0 0; min-height: 1.4em; white-space: pre-wrap; }
  .status.err { color: var(--accent); }
  progress { width: 100%; height: 6px; accent-color: var(--ink); margin-top: 8px; }
  figure { margin: 18px 0 0; }
  figcaption { font-size: 14px; color: var(--muted); margin-top: 6px; }
  figcaption b { color: var(--ink); font-weight: normal; font-variant: small-caps; letter-spacing: .04em; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
  th { text-align: left; font-weight: normal; font-variant: small-caps; letter-spacing: .04em; border-bottom: 1px solid var(--ink); padding: 6px 8px; }
  td { padding: 6px 8px; vertical-align: top; border-bottom: 1px solid var(--rule); }
  td.t { font: 13px var(--mono); color: var(--muted); white-space: nowrap; width: 1%; padding-top: 9px; }
  tr:last-child td { border-bottom: 0; }
  .empty td { color: var(--muted); font-style: italic; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 15px; margin: 0; }
  dt { font-variant: small-caps; letter-spacing: .04em; color: var(--muted); }
  dd { margin: 0; }
  a { color: var(--accent); }
  footer { margin-top: 40px; border-top: 1px solid var(--rule); padding-top: 12px; font-size: 14px; color: var(--muted); }
  ol.fn { padding-left: 1.2em; margin: 6px 0 0; }
  @media (max-width: 520px) { h1 { font-size: 25px; } td.t { white-space: normal; } }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .lang { display: flex; gap: 2px; font-size: 14px; flex-shrink: 0; }
  .lang button { padding: 2px 7px; font-size: 13px; letter-spacing: .05em; background: none; border-color: transparent; color: var(--muted); }
  .lang button[aria-pressed=true] { border-color: var(--ink); color: var(--ink); }
  .lang button:hover:not([aria-pressed=true]) { background: none; color: var(--ink); border-color: var(--rule); }
  .lang button[aria-pressed=true]:hover { background: none; color: var(--ink); }
</style>
</head>
<body>
<main>
  <header>
    <div class="top">
      <h1 data-t="h1">lb-whisper, in your browser</h1>
      <nav class="lang" aria-label="Language">
        <button data-lang="en" lang="en">EN</button>
        <button data-lang="fr" lang="fr">FR</button>
        <button data-lang="de" lang="de">DE</button>
        <button data-lang="lb" lang="lb">LB</button>
      </nav>
    </div>
    <p class="byline" data-t="byline">Luxembourgish speech recognition · Whisper large-v3-turbo fine-tuned on FLEURS · Sitraka Forler</p>
  </header>

  <p class="abstract" data-t="abstract" data-html></p>

  <h2><span class="n">1</span><span data-t="h2model">Model</span></h2>
  <div class="row">
    <select id="variant" aria-label="Model size">
      <option value="q4" data-t="optq4">Compact: about 760 MB, 4-bit</option>
      <option value="fp16" data-t="optfp16">Accurate: about 1.6 GB, 16-bit encoder</option>
    </select>
    <button id="load" data-t="load">Load the model</button>
  </div>
  <progress id="bar" max="1" value="0" hidden></progress>
  <p class="status" id="loadStatus"></p>

  <h2><span class="n">2</span><span data-t="h2audio">Audio</span></h2>
  <div class="row">
    <button id="rec" class="rec" disabled></button>
    <label class="file" id="fileLabel" aria-disabled="true"><span data-t="file">Choose a file…</span><input type="file" id="file" accept="audio/*,video/*" disabled></label>
  </div>
  <p class="note" data-t="note"></p>
  <p class="status" id="runStatus"></p>

  <h2><span class="n">3</span><span data-t="h2out">Transcript</span></h2>
  <figure>
    <table>
      <thead><tr><th data-t="thTime">Time</th><th data-t="thText">Text</th></tr></thead>
      <tbody id="out"></tbody>
    </table>
    <figcaption data-t="caption" data-html></figcaption>
  </figure>
  <div class="row" style="margin-top:12px">
    <button id="copy" data-t="copy" disabled>Copy text</button>
    <button id="srt" data-t="srt" disabled>Download .srt</button>
  </div>

  <h2><span class="n">4</span><span data-t="h2run">About this run</span></h2>
  <dl id="facts">
    <dt data-t="dtDevice">Device</dt><dd id="fDevice"></dd>
    <dt data-t="dtWeights">Weights</dt><dd id="fWeights"></dd>
    <dt data-t="dtAudio">Audio</dt><dd id="fAudio"></dd>
    <dt data-t="dtTime">Time</dt><dd id="fTime"></dd>
  </dl>

  <footer>
    <ol class="fn">
      <li data-t="fn1" data-html></li>
      <li data-t="fn2" data-html></li>
    </ol>
    <p data-t="code" data-html></p>
  </footer>
</main>

// ?local=1 loads the weights from ./models/ (for testing before they are on the Hub).
const LOCAL = new URLSearchParams(location.search).has("local");
const MODEL = "SitrakaForler/whisper-large-v3-turbo-lb-onnx";
if (LOCAL) { env.allowRemoteModels = false; env.allowLocalModels = true; env.localModelPath = "./models/"; }

const $ = (id) => document.getElementById(id);
let asr = null, segments = [], recorder = null, chunks = [], variantLoaded = null, lastRun = null;

function pickLang() {
  const asked = new URLSearchParams(location.search).get("lang");
  let saved = null;
  try { saved = localStorage.getItem("lbw-lang"); } catch {}
  for (const l of [asked, saved, ...navigator.languages.map((x) => x.slice(0, 2))]) if (T[l]) return l;
  return "en";
}
let lang = pickLang();
const t = (k) => T[lang][k];

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-t]").forEach((el) => {
    const v = t(el.dataset.t);
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("rec").textContent = recorder && recorder.state === "recording" ? t("stop") : t("rec");
  $("fDevice").textContent = asr ? t(asr.device === "webgpu" ? "gpu" : "cpu") : t("notLoaded");
  $("fWeights").textContent = variantLoaded ? t(variantLoaded === "q4" ? "wq4" : "wfp16") : t("na");
  $("fAudio").textContent = lastRun ? `${lastRun.label === "mic" ? t("mic") : lastRun.label}, ${mmss(lastRun.seconds)}` : t("na");
  $("fTime").textContent = lastRun ? t("took")(lastRun.took.toFixed(1), (lastRun.took / lastRun.seconds * 60).toFixed(1)) : t("na");
  render();
}
document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lbw-lang", lang); } catch {}
  applyLang();
}));

function status(el, text, err = false) { $(el).textContent = text; $(el).classList.toggle("err", err); }
function mmss(s) { const m = Math.floor(s / 60), r = Math.floor(s % 60); return `${m}:${String(r).padStart(2, "0")}`; }
function srtTime(s) {
  const ms = Math.round(s * 1000), h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60;
  const sec = Math.floor(ms / 1000) % 60, rest = ms % 1000;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")},${String(rest).padStart(3, "0")}`;
}
function ready(on) {
  $("rec").disabled = !on; $("file").disabled = !on;
  $("fileLabel").setAttribute("aria-disabled", String(!on));
}

$("load").onclick = async () => {
  const variant = $("variant").value;
  const device = navigator.gpu && (await navigator.gpu.requestAdapter().catch(() => null)) ? "webgpu" : "wasm";
  $("load").disabled = true; $("variant").disabled = true; $("bar").hidden = false;
  const files = {};
  const t0 = performance.now();
  try {
    asr = await pipeline("automatic-speech-recognition", MODEL, {
      device,
      dtype: { encoder_model: variant, decoder_model_merged: "q4" },
      progress_callback: (p) => {
        if (p.status === "progress" && p.total) {
          files[p.file] = [p.loaded, p.total];
          const [l, tot] = Object.values(files).reduce((a, [x, y]) => [a[0] + x, a[1] + y], [0, 0]);
          $("bar").value = l / tot;
          status("loadStatus", t("downloading")((l / 1e6).toFixed(0), (tot / 1e6).toFixed(0)));
        }
      },
    });
  } catch (e) {
    status("loadStatus", t("loadFail") + e.message, true);
    $("load").disabled = false; $("variant").disabled = false;
    return;
  }
  asr.device = device; variantLoaded = variant;
  $("bar").hidden = true;
  status("loadStatus", t("ready")(((performance.now() - t0) / 1000).toFixed(0)));
  applyLang();
  ready(true);
};

async function decode(blob) {
  const ctx = new AudioContext({ sampleRate: 16000 });
  const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
  await ctx.close();
  if (buf.numberOfChannels === 1) return buf.getChannelData(0);
  const out = new Float32Array(buf.length);
  for (let c = 0; c < buf.numberOfChannels; c++) buf.getChannelData(c).forEach((v, i) => (out[i] += v / buf.numberOfChannels));
  return out;
}

async function transcribe(blob, label) {
  ready(false);
  try {
    status("runStatus", t("decoding")(label === "mic" ? t("mic") : label));
    const audio = await decode(blob);
    const seconds = audio.length / 16000;
    status("runStatus", t("transcribing")(mmss(seconds)));
    const t0 = performance.now();
    const res = await asr(audio, {
      language: "luxembourgish", task: "transcribe",
      chunk_length_s: 30, stride_length_s: 5, return_timestamps: true,
    });
    const took = (performance.now() - t0) / 1000;
    segments = (res.chunks && res.chunks.length ? res.chunks : [{ timestamp: [0, seconds], text: res.text }])
      .map((c) => ({ start: c.timestamp[0] ?? 0, end: c.timestamp[1] ?? seconds, text: c.text.trim() }))
      .filter((c) => c.text);
    lastRun = { label, seconds, took, empty: !segments.length };
    applyLang();
    status("runStatus", t("done"));
  } catch (e) {
    status("runStatus", t("runFail") + e.message, true);
  }
  ready(true);
}

function render() {
  const body = $("out");
  body.replaceChildren();
  if (!segments.length) {
    const tr = document.createElement("tr"); tr.className = "empty";
    const x = document.createElement("td"); x.textContent = t(lastRun ? "nospeech" : "empty");
    tr.append(document.createElement("td"), x); body.append(tr);
  }
  for (const s of segments) {
    const tr = document.createElement("tr");
    const tm = document.createElement("td"); tm.className = "t"; tm.textContent = mmss(s.start);
    const x = document.createElement("td"); x.textContent = s.text;
    tr.append(tm, x); body.append(tr);
  }
  $("copy").disabled = $("srt").disabled = !segments.length;
}

$("file").onchange = (e) => { const f = e.target.files[0]; if (f) transcribe(f, f.name); e.target.value = ""; };

$("rec").onclick = async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach((tr) => tr.stop());
      $("rec").classList.remove("on"); $("rec").textContent = t("rec");
      transcribe(new Blob(chunks, { type: recorder.mimeType }), "mic");
    };
    recorder.start();
    $("rec").classList.add("on"); $("rec").textContent = t("stop");
    status("runStatus", t("recording"));
  } catch (e) {
    status("runStatus", t("noMic") + e.message, true);
  }
};

$("copy").onclick = () => navigator.clipboard.writeText(segments.map((s) => s.text).join("\n"));
$("srt").onclick = () => {
  const srt = segments.map((s, i) => `${i + 1}\n${srtTime(s.start)} --> ${srtTime(s.end)}\n${s.text}\n`).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([srt], { type: "text/plain" }));
  a.download = "transcript.srt"; a.click(); URL.revokeObjectURL(a.href);
};

applyLang();
</script>
</body>
</html>
