# Whisper large-v3-turbo, full fine-tuning (every layer, 809 M parameters according to the base
# model card) on FLEURS train plus the open data. Never trained yet: nothing below is a result.
# Memory on a 16 GB T4 has not been measured; plan for an L4 (24 GB) or an A100. A checkpoint is
# about 9.7 GB (float32 weights + two AdamW moments), see finetune/README.md before using Drive.
run_name: turbo-full-v2
base_model: openai/whisper-large-v3-turbo
language: luxembourgish
task: transcribe
data_dir: data/open_v2               # prepare_data.py --shards <folder> --out data/open_v2
output_dir: runs/turbo-full-v2

data:
  on_the_fly_features: true
  open_validation_split: validation_open
  max_eval_samples_open: 300

lora:
  enabled: false

spec_augment:
  enabled: true                  # set to false for a run without augmentation
  mask_time_prob: 0.05           # share of frames that start a time mask
  mask_time_length: 10           # 10 frames = 100 ms per mask
  mask_feature_prob: 0.0         # frequency masking off; try 0.05 in a separate run
  mask_feature_length: 10

train:
  num_train_epochs: 3
  learning_rate: 1.0e-5          # a tenth of the LoRA rate: all the pretrained weights move
  warmup_steps: 500
  lr_scheduler_type: linear
  weight_decay: 0.0
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2 # effective batch 16; 16 x 1 if the GPU has the memory
  per_device_eval_batch_size: 8
  fp16: true                     # works on every CUDA GPU; on L4 / A100 set fp16: false and bf16: true
  bf16: false
  gradient_checkpointing: true
  eval_strategy: steps
  eval_steps: 500
  save_steps: 500                # must stay a multiple of eval_steps
  logging_steps: 25
  save_total_limit: 2            # the best on FLEURS dev and the latest: about 19 GB on disk
  max_eval_samples: 400          # eval_fleurs_wer on this FLEURS dev subset selects the best checkpoint
  eval_generate: true
  generation_max_length: 448     # Whisper's decoder limit. 225 (v1) would cut the longest open validation transcripts (up to 244 tokens)
  dataloader_num_workers: 4
  seed: 42

filters:
  max_audio_seconds: 30.0
  max_label_tokens: 448
