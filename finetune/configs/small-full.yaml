# Whisper small, full fine-tune (244 M params). Never trained in this project: speed and accuracy not measured.
run_name: small-full
base_model: openai/whisper-small
language: luxembourgish
task: transcribe
data_dir: data/fleurs_lb
output_dir: runs/small-full

lora:
  enabled: false

train:
  num_train_epochs: 5
  learning_rate: 1.0e-5
  warmup_steps: 200
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1
  per_device_eval_batch_size: 16
  fp16: true
  gradient_checkpointing: true
  eval_strategy: steps
  eval_steps: 157                # one epoch: ceil(2,502 utt / batch 16)
  save_steps: 157
  logging_steps: 25
  save_total_limit: 2
  max_eval_samples: 400
  eval_generate: true
  generation_max_length: 225
  seed: 42

filters:
  max_audio_seconds: 30.0
  max_label_tokens: 448
